set-option -sa terminal-override ",xterm*:Tc"

# Enable mouse support (resize panes, scroll, click to select)
set -g mouse on

# Start window/pane numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows when one is closed
set -g renumber-windows on

# tmux-sensible
# vim mode switching delay
set -s escape-time 20

set -g history-limit 50000

set -g display-time 4000

set -g status-interval 5

set -g default-terminal "screen-256color"

set -g status-keys emacs

set -g focus-events on

setw -g aggressive-resize on

# default split keys in the same directory
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

# = for horizontal split, - for vertical split
bind = split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Navigate panes with Alt + arrow keys (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-H previous-window
bind -n M-L next-window

